# git-cliff config, Conventional Commits → CHANGELOG.md
# Drives `just release`. See https://git-cliff.org for full docs.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

# To enable PR-number links (e.g. " (#42)"), uncomment the block below AND
# re-add `{% if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}`
# to the body template. Requires GITHUB_TOKEN in the environment.
#
# [remote.github]
# owner = "your-gh-username"
# repo  = "your-repo-name"
footer = "<!-- generated by git-cliff -->"
trim = true

[git]
conventional_commits   = true
filter_unconventional  = false
protect_breaking_commits = true
tag_pattern            = "v[0-9].*"
ignore_tags            = "rc|alpha|beta"
sort_commits           = "newest"

# Normalize commit subjects before grouping/rendering. Squash-merged PRs
# carry the original PR description as the commit body, and some early
# squash merges have leading whitespace on the subject line that breaks
# the conventional commit parser. Without these preprocessors the body
# leaks into entries and `  feat(scope):` falls through to raw text.
commit_preprocessors = [
  # Drop everything after the first newline (subject only).
  { pattern = '\n[\s\S]*', replace = '' },
  # Strip leading whitespace so `^feat:` parsers match.
  { pattern = '^\s+',      replace = '' },
  # Trim trailing whitespace.
  { pattern = '\s+$',      replace = '' },
]

commit_parsers = [
  { message = "^feat: initial commit", skip = true },
  { message = "^feat",     group = "<!-- 0 -->Features" },
  { message = "^fix",      group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf",     group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc",      group = "<!-- 4 -->Documentation" },
  { message = "^revert",   group = "<!-- 5 -->Revert" },
  { message = "^security", group = "<!-- 6 -->Security" },
  { message = "^build",    group = "<!-- 7 -->Build" },
  { message = "^ci",       group = "<!-- 8 -->CI" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore\\(sync\\):",    skip = true },
  { message = "^chore\\(deps\\):",    group = "<!-- 9 -->Dependencies" },
  { message = "^chore",    skip = true },
  { message = "^style",    skip = true },
  { message = "^test",     skip = true },
  { message = "^wip",      skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
