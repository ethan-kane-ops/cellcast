apiVersion: v2
name: cellcast
description: Multi-cluster deployment placement oracle and short-lived credential broker
type: application

# Both move with the git tag, and appVersion is that tag verbatim.
#
# Helm allows the two to diverge, and for a chart packaged separately from what
# it installs that indirection earns its keep. Here one tag cuts the images and
# both charts from one commit, so a chart version that did not match would name
# a release nothing else in the project has heard of. appVersion keeps the `v`
# because it is also the default image tag, and the image is tagged with the git
# tag; version drops it because Helm requires bare semver.
version: 0.2.0
appVersion: "v0.2.0"

home: https://github.com/ethan-kane-ops/cellcast
sources:
  - https://github.com/ethan-kane-ops/cellcast
keywords:
  - multi-cluster
  - placement
  - deployment
  - credentials
  - oidc
maintainers:
  - name: ethan-kane-ops
    url: https://github.com/ethan-kane-ops
kubeVersion: ">=1.28.0-0"

annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: Cluster
      version: v1alpha1
      name: clusters.cellcast.io
      displayName: Cluster
      description: A registered cell in the fleet
    - kind: PlacementPolicy
      version: v1alpha1
      name: placementpolicies.cellcast.io
      displayName: PlacementPolicy
      description: Which callers may reach which cells, and how the survivors are ranked
    - kind: TrustConfig
      version: v1alpha1
      name: trustconfigs.cellcast.io
      displayName: TrustConfig
      description: How the hub authenticates to one cell in order to mint for it
  artifacthub.io/signKey: |
    fingerprint: unpublished
    url: https://github.com/ethan-kane-ops/cellcast
