{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "crd-bases/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- if not $crd.metadata }}
{{- fail (printf "%s is not a readable CustomResourceDefinition; run `just manifests` to refresh the chart's copy" $path) }}
{{- end }}
---
# Generated by controller-gen from api/v1alpha1 and copied here by
# `just manifests`. Never hand-edit: `just verify-generate` fails on a copy that
# has drifted from the types.
apiVersion: {{ $crd.apiVersion }}
kind: {{ $crd.kind }}
metadata:
  name: {{ $crd.metadata.name }}
  labels:
    {{- include "cellcast.labels" $ | nindent 4 }}
    {{- with $crd.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with $crd.metadata.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $.Values.crds.keep }}
    # Deleting a CRD deletes every object of that kind with it, so an uninstall
    # would take the whole registry: every Cluster, every PlacementPolicy,
    # every TrustConfig. Left behind.
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  {{- toYaml $crd.spec | nindent 2 }}
{{- end }}
{{- end }}
