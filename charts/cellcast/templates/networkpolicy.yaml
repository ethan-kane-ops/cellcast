{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cellcast.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cellcast.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cellcast.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Probes come from the kubelet, which is not a pod and matches no selector,
    # so the probe port is open to the whole cluster. It discloses a status
    # string and nothing about the registry.
    - ports:
        - port: probes
          protocol: TCP
    {{- with .Values.networkPolicy.allowedIngress }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: api
          protocol: TCP
    {{- end }}
    {{- if gt (int .Values.ports.metrics) 0 }}
    {{- with .Values.networkPolicy.metricsAllowedIngress }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
