---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: placementpolicies.cellcast.io
spec:
  group: cellcast.io
  names:
    kind: PlacementPolicy
    listKind: PlacementPolicyList
    plural: placementpolicies
    shortNames:
    - ccpol
    singular: placementpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.strategy
      name: Strategy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Cells
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlacementPolicy authorizes a set of callers to a set of cells.

          Policy is a custom resource rather than hub configuration so that it is
          GitOps-managed, reviewable in a pull request, and auditable through the API
          server. Policy nobody can diff is policy that drifts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlacementPolicySpec maps authenticated callers to the cells
              they may reach.
            properties:
              allowDarkTargeting:
                default: false
                description: |-
                  AllowDarkTargeting permits matching callers to explicitly request a DARK
                  cell. Off by default: dark cells exist so that QA can smoke-test without
                  production traffic, and a pipeline reaching one by accident defeats that.
                type: boolean
              permittedCells:
                description: |-
                  PermittedCells selects the Cluster resources matching callers may reach.
                  This is the filter step, and it runs before any scoring. Running scoring
                  first is how a dev pipeline lands in the least-loaded production cluster
                  (docs/architecture.md ADR-005, docs/threat-model.md T-03).
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              strategy:
                default: LeastLoaded
                description: |-
                  Strategy selects among permitted, eligible cells.

                  Chosen by policy rather than per request on purpose: a caller that can
                  pick the strategy can steer itself into a specific cell.
                enum:
                - LeastLoaded
                - RoundRobin
                type: string
              subjects:
                description: |-
                  Subjects are the callers this policy applies to. A request matching no
                  policy is rejected; there is no implicit "any cell" fallback.
                items:
                  description: |-
                    SubjectSelector matches an authenticated caller.

                    Claims are matched against the values extracted from the caller's workload
                    identity token by the provider that owns the issuer. All entries must match;
                    an empty Claims map matches any caller from the issuer, which is almost
                    always too broad for anything but a development policy.
                  properties:
                    claims:
                      additionalProperties:
                        type: string
                      description: |-
                        Claims are exact-match requirements on the extracted caller claims,
                        for example {"repository": "ethan-kane-ops/cellcast"}.
                      type: object
                    issuer:
                      description: |-
                        Issuer is the OIDC issuer URL the caller's token must come from. It must
                        also be on the hub's issuer allowlist; naming it here does not add it.
                      minLength: 1
                      type: string
                    subject:
                      description: |-
                        Subject is an exact-match requirement on the caller's `sub` claim.

                        Needed because `sub` is the only claim some issuers carry that
                        distinguishes one caller from another. A Kubernetes ServiceAccount token
                        has `sub` and a nested object and nothing else usable, so an
                        issuer-only selector against a cluster issuer permits every workload in
                        that cluster.
                      type: string
                  required:
                  - issuer
                  type: object
                minItems: 1
                type: array
              tokenTTL:
                description: |-
                  TokenTTL bounds credential lifetime for placements made under this
                  policy.
                properties:
                  default:
                    description: Default is the TTL granted when the caller does not
                      ask for one.
                    type: string
                  max:
                    description: |-
                      Max is the ceiling no request can raise. This is the operator-set bound
                      that limits the blast radius of a compromised hub process
                      (docs/threat-model.md T-01).
                    type: string
                type: object
            required:
            - permittedCells
            - subjects
            type: object
          status:
            description: PlacementPolicyStatus is the observed state of a policy.
            properties:
              conditions:
                description: |-
                  Conditions describe the policy's current condition, including whether its
                  selector currently matches any registered cell.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
