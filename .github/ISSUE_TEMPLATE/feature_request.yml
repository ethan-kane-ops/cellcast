name: Feature request
description: Suggest something cellcast should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        [ROADMAP.md](https://github.com/ethan-kane-ops/cellcast/blob/main/ROADMAP.md)
        lists what is planned, and what has been decided against and why. Read it
        first.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that cellcast makes hard. Not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Including anything that nearly worked. That is usually where the real gap is.
