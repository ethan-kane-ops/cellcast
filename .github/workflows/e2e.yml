# The suites that need real clusters. They build their own kind clusters, take
# minutes each, and are the only place most of the agent and fallback behaviour
# is exercised end to end.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run, for reproducing a failure without pushing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    # Each recipe creates and destroys its own clusters, so they are
    # independent and the matrix is free parallelism. fail-fast is off because
    # knowing that three of them broke is more useful than knowing one did.
    strategy:
      fail-fast: false
      matrix:
        recipe:
          # A credential minted against a real API server, bounded by its RBAC.
          - verify-mint
          # A placement end to end, then the hub dies and every declared
          # fallback stance is checked.
          - verify-e2e
          # Three cells, three agents, and one dropping out of scoring.
          - verify-agent
          # Both charts installed for real, which is the only check that the
          # image the Dockerfile builds runs under the chart that ships it.
          - verify-chart
          # The previous release from GHCR, upgraded in place to this tree,
          # which is the path every adopter takes after the first install.
          - verify-upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # The recipes call `kind` directly and create clusters with their own
      # service account issuers, so this installs the binary and no cluster.
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - run: just ${{ matrix.recipe }}
