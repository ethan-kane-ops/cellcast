# The documentation site.
#
# Split into build and deploy because they need different tokens. The build
# reads the repository and nothing else; only the deploy job gets `pages: write`
# and `id-token: write`, so a change to the site content cannot reach the
# deployment credential.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not per-ref. Two deploys racing to publish the same site is one of them
  # losing silently, so this queues rather than cancels.
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go, just and uv. The build itself is `just docs-build`, the same
      # command a contributor runs, so the site CI publishes and the site a
      # contributor previews cannot drift.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # --strict, so a broken internal link fails here rather than shipping as
      # a 404 on the published site.
      - run: just docs-build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    runs-on: ubuntu-latest
    needs: [build]
    # A pull request builds the site to prove it still builds. It does not
    # publish it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
