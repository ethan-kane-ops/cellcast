# The gate, in CI. Every job here runs a `just` recipe rather than an inline
# script, so that what CI checks and what a contributor can run locally cannot
# drift apart.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only. Nothing in this workflow writes to the repository, and a token
# scoped wider than the job needs is the finding an OSSF Scorecard run opens
# with.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # tidy, verify-generate, lint, chart-lint, test. The same command the
      # pre-commit hooks run.
      - run: just check

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: just test-race

  envtest:
    name: CRDs and controllers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # A real kube-apiserver and etcd. The fake client the unit tests use
      # accepts objects the API server refuses, so the validation markers, the
      # defaults and the CEL rules are only checked here.
      - run: just envtest

  vuln:
    name: vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: just vuln
      # Asked of the built artifacts as well as the source: a binary records
      # the module versions it was built from, and that is the question an
      # adopter is really asking.
      - run: just vuln-binaries
