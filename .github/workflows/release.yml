# The release.
#
# This path is load-bearing. Keyless signatures carry the identity of the
# workflow that made them, and every `cosign verify` command in the README and
# in docs/releasing.md names
# `.github/workflows/release.yml@refs/tags/<tag>`. The justfile holds the same
# string as `sign_workflow`, and a contract test keeps the docs and the justfile
# in step. Renaming or moving this file invalidates every published verify
# command, and no test can catch that.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled. A half-published release is the one state this pipeline
  # cannot recover from on its own.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release, created by goreleaser.
      contents: write
      # GHCR, for three images and two charts.
      packages: write
      # Keyless signing. Fulcio issues a short-lived certificate against this
      # token, and the identity it certifies is this workflow.
      id-token: write
      # Attestations attached to the published images.
      attestations: write
    steps:
      # Full history and tags: `just release` refuses a tag it cannot resolve,
      # and git-cliff builds the notes from the commits since the last one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # go, just, helm, helm-docs, golangci-lint, syft.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # `just release` runs the full gate and the end-to-end suite before it
      # publishes anything, and the e2e suite builds real kind clusters.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # install-only: the pipeline calls goreleaser from `just release`, so that
      # the same command works from a laptop.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true

      # git-cliff has no first-party action. Pinned by version and checked
      # against its digest, for the same reason the base images are pinned.
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.1
          GIT_CLIFF_SHA256: dfe9bef0c7a00d05fafe78e6e591a1a280d39dd495b8066764db0a559acde67f
        run: |
          set -euo pipefail
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive"
          install -m 0755 "git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          rm -rf "$archive" "git-cliff-${GIT_CLIFF_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One command. It guards the tree, runs `check-all` and the e2e suite,
      # publishes images then charts then the GitHub release, and verifies its
      # own signatures last. Every step of it is rehearsable locally with
      # `just release-check`.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release "${GITHUB_REF_NAME}"
