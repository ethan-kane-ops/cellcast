# RBAC for the cellcast reporter agent.
#
# This is the whole of what the agent is granted in a cell it runs in. It is
# deliberately short enough to read in full before installing it.
#
# What the agent CANNOT do, and why that matters more than what it can:
#   * It cannot read Secrets, ConfigMaps or any workload spec beyond resource
#     requests. It reports arithmetic over nodes and pods, nothing else.
#   * It cannot create, update or delete anything in the cluster except the one
#     Lease below.
#   * It holds no credential for the hub or for any other cell. Its only
#     identity is the projected ServiceAccount token in the Deployment, which
#     the cluster issues and rotates, and which the hub accepts only for the
#     cell whose registration names it (docs/threat-model.md T-07).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellcast-agent
  namespace: cellcast-system
---
# Cluster-scoped because capacity is a cluster-level fact: the agent has to see
# every node and every pod to compute it. Read-only, and `get` is deliberately
# absent because the agent only ever lists and watches.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cellcast-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cellcast-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cellcast-agent
subjects:
  - kind: ServiceAccount
    name: cellcast-agent
    namespace: cellcast-system
---
# Leader election. Namespaced rather than cluster-scoped, and named so the
# agent can write exactly one Lease and no others: a Role granting `update` on
# leases across the namespace would let a compromised agent break every other
# controller's election in it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellcast-agent
  namespace: cellcast-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cellcast-agent"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellcast-agent
  namespace: cellcast-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellcast-agent
subjects:
  - kind: ServiceAccount
    name: cellcast-agent
    namespace: cellcast-system
