# The cellcast reporter agent.
#
# A Deployment with leader election, not a DaemonSet. Capacity is a
# cluster-level fact, so one reporter per node would publish N copies of the
# same number at N times the API server cost.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellcast-agent
  namespace: cellcast-system
  labels:
    app.kubernetes.io/name: cellcast-agent
spec:
  # Two replicas for availability, one of which reports. The other holds the
  # lease's runner-up position and takes over without waiting for a reschedule.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cellcast-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cellcast-agent
    spec:
      serviceAccountName: cellcast-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/ethan-kane-ops/cellcast-agent:latest
          args:
            - --hub-endpoint=https://cellcast-hub.cellcast-system.svc:8080
            # The Cluster resource this cell is registered as. It must match
            # the name in the hub's registry, and the hub will only accept
            # reports for it from the identity that registration names.
            - --cell-name=REPLACE-WITH-THIS-CELLS-NAME
            - --namespace=cellcast-system
          env:
            # Names this replica in the lease, so `kubectl get lease` says which
            # pod is reporting rather than showing an opaque identifier.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          # Readiness tracks the informer caches, not leadership: a standby
          # replica is working as intended and must report ready, or a
          # two-replica Deployment permanently shows one pod unhealthy.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cellcast-token
              mountPath: /var/run/secrets/cellcast
              readOnly: true
      volumes:
        # The agent's identity. A projected token with cellcast's own audience,
        # NOT the default ServiceAccount token: that one is minted for the API
        # server, and a hub that accepted it would be accepting a credential
        # minted for somebody else.
        #
        # expirationSeconds is one hour; the kubelet rewrites the file at 80% of
        # that and the agent re-reads it on every heartbeat, so nothing here
        # depends on a token living as long as the pod.
        - name: cellcast-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: cellcast
                  expirationSeconds: 3600
