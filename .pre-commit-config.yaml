# Local verification layer. These hooks and `just check` gate a commit before
# it is pushed; CI runs the same recipes again.
#
# Install with `just hooks`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml
        # Generated CRDs are large and valid; helm templates are not plain YAML.
        exclude: ^(config/crd/bases/|charts/.*/templates/)
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        files: ^(go\.mod|go\.sum)$

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        types: [go]

      # Generated deepcopy and CRD output must match the types they come from.
      # A hand-edited CRD is a silent correctness bug.
      - id: verify-generate
        name: verify generated output
        entry: just verify-generate
        language: system
        pass_filenames: false
        files: ^api/
