# The sample workload the integration workflow deploys with the credential
# cellcast minted. Nothing here is cellcast-specific: it is an ordinary
# Deployment, applied by an ordinary kubectl, which is the whole point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: apps
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/managed-by: cellcast-integration-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
