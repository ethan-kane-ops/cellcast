# A deploy job with no secret in it. Copy this into .github/workflows/ and
# change the hub, the workload and the manifest path.
#
# The only credential the job holds is the identity token GitHub issues for it,
# and that is issued per run and expires on its own. Nothing is stored in the
# repository, nothing is rotated, and revoking access is an edit to a
# PlacementPolicy rather than a hunt for which repositories hold which secret.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  # Without this the runner exposes no token endpoint and the action fails
  # before it reaches the hub. It is the most common way this goes wrong.
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: cellcast
        uses: ethan-kane-ops/cellcast/.github/actions/place@v0.3.0
        with:
          hub: https://cellcast.example.com
          workload: checkout-api
          ttl: 15m

      # KUBECONFIG is already set, and points at a kubeconfig for the cell
      # cellcast chose holding a credential that expires in fifteen minutes.
      - run: kubectl -n apps apply -f deploy/checkout-api.yaml

      - run: echo "deployed to ${{ steps.cellcast.outputs.cell }}"
